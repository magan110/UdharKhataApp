name: Build downloadable Android APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to build
        required: true
        default: main
        type: string
      api_base_url:
        description: Public API base URL
        required: false
        default: ''
        type: string
      google_server_client_id:
        description: Public Google web client ID
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install locked dependencies
        working-directory: udhaarkhata
        run: flutter pub get --enforce-lockfile
      - name: Build debug APK
        working-directory: udhaarkhata
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id }}
        run: |
          flutter build apk --debug \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: Udhaar-Khata-debug-APK
          path: udhaarkhata/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
