name: Inspect Android APK signing

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: APK build workflow run to inspect
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  inspect-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Udhaar-Khata-debug-APK
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inspected-apk
      - name: Verify the exact downloaded APK
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'inspected-apk'
          apks = list(root.rglob('app-debug.apk'))
          if len(apks) != 1:
              raise SystemExit('Expected exactly one app-debug.apk')
          apk = apks[0]
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools'
          signer = sorted(tools.glob('*/apksigner'))[-1]
          certs = subprocess.check_output(
              [str(signer), 'verify', '--print-certs', str(apk)], text=True)
          print(certs)
          match = re.search(r'certificate SHA-1 digest:\s*([0-9a-fA-F]{40})', certs)
          if not match:
              raise SystemExit('APK signer SHA-1 was not reported')
          sha1 = ':'.join(match[1][i:i+2].upper() for i in range(0, 40, 2))
          badging = subprocess.check_output(
              [str(signer.parent / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          package = re.search(r"^package: name='([^']+)'", badging)
          if not package:
              raise SystemExit('APK application ID was not reported')
          with zipfile.ZipFile(apk) as archive:
              kernel = archive.read('assets/flutter_assets/kernel_blob.bin')
          info = {
              'application_id': package[1],
              'signing_sha1': sha1,
              'apk_sha256': hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest(),
              'api_base_url_verified': b'https://udhaarkhata-api-staging.udhaarkhata-api.workers.dev' in kernel,
              'google_server_client_id_verified': b'1098240805044-90hnifajs9hvtvcive1d65r3q2cqnu03.apps.googleusercontent.com' in kernel,
          }
          print('::notice title=Exact APK signing audit::' + json.dumps(info))
          (root / 'apk-audit.json').write_text(json.dumps(info, indent=2) + '\n')
          if info['application_id'] != 'com.udhaarkhata.app':
              raise SystemExit('Unexpected APK application ID')
          if not info['api_base_url_verified'] or not info['google_server_client_id_verified']:
              raise SystemExit('Expected staging defines were not found in the exact APK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: APK-signing-audit
          path: ${{ runner.temp }}/inspected-apk/apk-audit.json
          if-no-files-found: error
          retention-days: 14
