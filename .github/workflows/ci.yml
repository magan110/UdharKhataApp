name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_doc_navigation.py --check
      - run: python scripts/check_docs.py
      - run: python scripts/check_release.py
      - run: python -m pip install cryptography==50.0.0
      - run: python scripts/restore_drill.py

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: udhaarkhata
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: python ../scripts/check_coverage.py coverage/lcov.info

  worker:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate:local
      - run: npm run db:check:local
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high
